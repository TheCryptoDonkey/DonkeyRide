# ==========================================
# Minimal public demo/production stack
# ==========================================
# Just the operator + a Nostr relay. NO database and NO Redis: the operator
# is a thin, non-custodial coordinator. Durable state lives on Nostr (the
# operator publishes PII-free state snapshots and rehydrates from them on
# restart); coordination state is in-memory and ephemeral by design.
#
# Front with a TLS reverse proxy (Caddy/nginx):
#   HTTPS   ->  127.0.0.1:3999  (API + web app)
#   /ws     ->  127.0.0.1:3998  (WebSocket)
#   /relay  ->  127.0.0.1:3997  (Nostr relay, strfry)
#
# Put OPERATOR_PRIVKEY (or OPERATOR_NSEC) in a .env file next to this compose
# file so the operator keeps a stable Nostr identity across restarts — without
# it the operator cannot sign snapshots and loses its Nostr durability.
#
#   docker compose -f docker-compose.demo.yml up -d --build
#
# To join an existing private Valhalla network, also pass
# docker-compose.private-routing.yml; see docs/OPERATOR-POLICY.md.
#
# Operators who WANT a database (e.g. a licensed Mode-B operator retaining PII
# under GDPR controller obligations) can add a Postgres service and set
# DATABASE_URL; the operator uses it automatically. It is not part of the
# default, non-custodial deployment.

services:
  operator:
    build: .
    restart: unless-stopped
    environment:
      OPERATOR_NAME: "DonkeyRide Public Demo"
      # Open reference market. A taxi company can set regulated plus an
      # allowlist; see docs/OPERATOR-POLICY.md.
      OPERATOR_POLICY_MODE: ${OPERATOR_POLICY_MODE:-open}
      OPERATOR_ADMISSION_MODE: ${OPERATOR_ADMISSION_MODE:-open}
      OPERATOR_ALLOWED_DRIVERS: ${OPERATOR_ALLOWED_DRIVERS:-}
      OPERATOR_RECORD_MODE: ${OPERATOR_RECORD_MODE:-ephemeral}
      OPERATOR_TERMS_URL: ${OPERATOR_TERMS_URL:-}
      OPERATOR_PRIVACY_URL: ${OPERATOR_PRIVACY_URL:-}
      OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
      DOMAIN: ridesharing
      # Non-custodial by default: the operator never touches funds.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-cash}
      ENABLE_NIP98_AUTH: "true"
      ENABLE_RATE_LIMITING: "true"
      FEDERATION_CORS: ${FEDERATION_CORS:-true}
      DISPATCH_RADIUS_KM: "15"
      NODE_ENV: ${NODE_ENV:-production}
      # Only needed if PAYMENT_PROVIDER is demo (mock rail) on a public demo.
      ALLOW_DEMO_PAYMENTS: ${ALLOW_DEMO_PAYMENTS:-false}
      OPERATOR_PRIVKEY: ${OPERATOR_PRIVKEY:-}
      OPERATOR_PUBKEY: ${OPERATOR_PUBKEY:-}
      NOSTR_RELAY: ws://nostr-relay:7777
      NOSTR_RELAYS: ${NOSTR_RELAYS:-}
      PUBLIC_RELAY_URLS: ${PUBLIC_RELAY_URLS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      OSRM_URL: ${OSRM_URL:-}
      NAVIGATION_PROVIDER: ${NAVIGATION_PROVIDER:-osrm}
      VALHALLA_URL: ${VALHALLA_URL:-}
      # Web Push job alerts — pin once with `npx web-push generate-vapid-keys`
      # (unset = ephemeral keys; driver push subscriptions die on restart)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # No DATABASE_URL and no REDIS_URL: in-memory + Nostr only.
      DISABLE_REDIS: "true"
      PORT: 3000
      WS_PORT: 3001
    ports:
      - "127.0.0.1:3999:3000"
      - "127.0.0.1:3998:3001"
    depends_on:
      nostr-relay:
        condition: service_started

  nostr-relay:
    image: ghcr.io/hoytech/strfry:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3997:7777"
    volumes:
      - ./docker/strfry/strfry.conf:/etc/strfry.conf:ro
      - demo-strfry-db:/app/strfry-db

volumes:
  demo-strfry-db:
