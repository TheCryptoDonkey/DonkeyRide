# Optional private storage overlay required to ACCEPT Community Lift tasks in
# production. The base demo stack remains database-free; this overlay adds an
# internal-only PostgreSQL service and makes its secret requirements explicit.
#
#   docker compose -f docker-compose.demo.yml \
#     -f docker-compose.private-routing.yml \
#     -f docker-compose.community-lift.yml up -d --build

services:
  operator:
    environment:
      OPERATOR_RECORD_MODE: durable
      DATABASE_URL: postgresql://donkey:${DB_PASSWORD:?Set DB_PASSWORD in .env}@community-lift-postgres:5432/donkeyride
      TASK_DATA_ENCRYPTION_KEY: ${TASK_DATA_ENCRYPTION_KEY:?Set TASK_DATA_ENCRYPTION_KEY in .env}
      HANDOFF_HMAC_SECRET: ${HANDOFF_HMAC_SECRET:-}
    depends_on:
      community-lift-postgres:
        condition: service_healthy

  community-lift-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: donkeyride
      POSTGRES_USER: donkey
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - community-lift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donkey -d donkeyride"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No host port: only the operator on this Compose network can reach it.

volumes:
  community-lift-postgres-data:
