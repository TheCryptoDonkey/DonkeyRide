##
## Default strfry config for DonkeyRide
##

# Directory for database files
db = "./strfry-db/"

# Database compaction settings
dbParams {
    # Max DB size (10 GB)
    maxDbSize = 10000000000

    # Checkpoint interval (MB)
    dbsizeCheckpointKiB = 1000
}

# Events processing
events {
    # Reject events older than this many seconds
    rejectEventsOlderThanSeconds = 94608000  # 3 years

    # Reject events newer than this many seconds in the future
    rejectEventsNewerThanSeconds = 900  # 15 minutes

    # Maximum event size in bytes
    maxEventSize = 65536  # 64 KB
}

# Relay configuration
relay {
    # Bind to all interfaces
    bind = "0.0.0.0"
    port = 7777

    # NoStr relay information
    info {
        name = "DonkeyRide Nostr Relay"
        description = "Dedicated Nostr relay for DonkeyRide ridesharing protocol"
        pubkey = ""  # Will be set via environment
        contact = "admin@donkeyride.com"

        # Supported NIPs
        supported_nips = [1, 2, 4, 9, 11, 12, 15, 16, 20, 22, 33, 40, 42, 45, 50]

        # Software info
        software = "git+https://github.com/hoytech/strfry.git"
        version = "latest"
    }

    # Limits
    maxWebsocketPayloadSize = 131072  # 128 KB

    # Compression
    compression {
        enabled = true
        slidingWindow = 1024
    }

    # Logging
    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
    }

    # Performance
    numThreads = 4
}

# Plugin for write policy (optional)
writePolicy {
    # No plugin by default - accept all events
    # To add filtering, create a plugin script:
    # plugin = "./strfry-policy.py"
}

# Negentropy protocol (efficient sync)
negentropy {
    enabled = true
    maxSyncEvents = 100000
}
