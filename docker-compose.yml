version: '3.8'

services:
  donkeyride-relay:
    build: .
    ports:
      - "3000:3000"  # REST API
      - "3001:3001"  # WebSocket
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=3001
      - OPERATOR_PUBKEY=${OPERATOR_PUBKEY}
      - OPERATOR_LIGHTNING=${OPERATOR_LIGHTNING}
      - STRIKE_API_KEY=${STRIKE_API_KEY}
      - NOSTR_RELAY=wss://relay.damus.io
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./data:/usr/src/app/data  # For persistent storage if needed
    networks:
      - donkeyride-network

  # Optional: Add Redis for caching/session management
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - donkeyride-network

  # Optional: Add Postgres for ride history
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=donkeyride
      - POSTGRES_USER=donkey
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - donkeyride-network

networks:
  donkeyride-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data: