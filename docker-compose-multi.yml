# Multi-Operator Docker Setup
# Demonstrates federated model with 3 competing operators

version: '3.8'

networks:
  donkeyride:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  strfry-db:

services:
  # ========================================
  # SHARED INFRASTRUCTURE
  # ========================================

  # Nostr Relay (shared by all operators)
  nostr-relay:
    image: ghcr.io/hoytech/strfry:latest
    container_name: nostr-relay
    ports:
      - "7777:7777"
    volumes:
      - ./docker/strfry/strfry.conf:/etc/strfry.conf:ro
      - strfry-db:/app/strfry-db
    networks:
      - donkeyride
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7777"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL (shared database)
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: donkeyride
      POSTGRES_USER: donkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rideshare123}
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres-data:/var/lib/postgresql/data
    networks:
      - donkeyride
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donkey"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis (shared cache)
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - donkeyride
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================
  # OPERATOR A - "FastRides" (Low fees)
  # ========================================

  operator-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operator-a-fastr

ides
    ports:
      - "3000:3000"  # HTTP API
      - "3001:3001"  # WebSocket
    environment:
      # Operator identity
      - OPERATOR_NAME=FastRides
      - OPERATOR_PUBKEY=${OPERATOR_A_PUBKEY:-npub1fastrideexample}
      - OPERATOR_LIGHTNING=fastr@getalby.com
      - OPERATOR_FEE_PERCENT=0.003  # 0.3% fee (lowest!)

      # Server config
      - PORT=3000
      - WS_PORT=3001
      - NODE_ENV=production

      # Infrastructure
      - NOSTR_RELAY=ws://nostr-relay:7777
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://donkey:${POSTGRES_PASSWORD:-rideshare123}@postgres:5432/donkeyride
      - TASK_DATA_ENCRYPTION_KEY=${TASK_DATA_ENCRYPTION_KEY:-}

      # Payment provider
      - PAYMENT_PROVIDER=mock

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nostr-relay:
        condition: service_healthy
    networks:
      - donkeyride
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================
  # OPERATOR B - "CityRides" (Standard)
  # ========================================

  operator-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operator-b-cityrides
    ports:
      - "3100:3000"  # HTTP API
      - "3101:3001"  # WebSocket
    environment:
      # Operator identity
      - OPERATOR_NAME=CityRides
      - OPERATOR_PUBKEY=${OPERATOR_B_PUBKEY:-npub1cityridesexample}
      - OPERATOR_LIGHTNING=city@getalby.com
      - OPERATOR_FEE_PERCENT=0.005  # 0.5% fee (standard)

      # Server config
      - PORT=3000
      - WS_PORT=3001
      - NODE_ENV=production

      # Infrastructure
      - NOSTR_RELAY=ws://nostr-relay:7777
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://donkey:${POSTGRES_PASSWORD:-rideshare123}@postgres:5432/donkeyride
      - TASK_DATA_ENCRYPTION_KEY=${TASK_DATA_ENCRYPTION_KEY:-}

      # Payment provider
      - PAYMENT_PROVIDER=mock

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nostr-relay:
        condition: service_healthy
    networks:
      - donkeyride
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================
  # OPERATOR C - "PremiumRides" (Premium)
  # ========================================

  operator-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operator-c-premiumrides
    ports:
      - "3200:3000"  # HTTP API
      - "3201:3001"  # WebSocket
    environment:
      # Operator identity
      - OPERATOR_NAME=PremiumRides
      - OPERATOR_PUBKEY=${OPERATOR_C_PUBKEY:-npub1premiumridesexample}
      - OPERATOR_LIGHTNING=premium@getalby.com
      - OPERATOR_FEE_PERCENT=0.010  # 1.0% fee (premium service)

      # Server config
      - PORT=3000
      - WS_PORT=3001
      - NODE_ENV=production

      # Infrastructure
      - NOSTR_RELAY=ws://nostr-relay:7777
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://donkey:${POSTGRES_PASSWORD:-rideshare123}@postgres:5432/donkeyride
      - TASK_DATA_ENCRYPTION_KEY=${TASK_DATA_ENCRYPTION_KEY:-}

      # Payment provider
      - PAYMENT_PROVIDER=mock

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nostr-relay:
        condition: service_healthy
    networks:
      - donkeyride
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========================================
  # DEVELOPMENT TOOLS (optional)
  # ========================================

  # Database Admin UI
  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - donkeyride
    profiles: ["dev"]

  # Redis Admin UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - donkeyride
    profiles: ["dev"]

  # Mock Lightning Node
  mock-lightning:
    build:
      context: ./docker/mock-lightning
      dockerfile: Dockerfile
    container_name: mock-lightning
    ports:
      - "8080:8080"
    networks:
      - donkeyride
    profiles: ["dev"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
