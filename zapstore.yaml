# Zapstore publishing config for DonkeyRide Driver (Android).
# Publish with zsp (https://github.com/zapstore/zsp):
#
#   SIGN_WITH=<publisher nsec or bunker://…> zsp publish
#
# The signing key becomes the app's PERMANENT publisher identity on
# Zapstore. DonkeyRide uses the existing Heartwood-backed ForgeSworn
# publisher identity already used for Cambium and My Signet. See
# docs/ZAPSTORE.md.

name: DonkeyRide Driver
summary: Direct rider and driver coordination over Nostr, without platform commission
description: >-
  DonkeyRide Driver is a non-custodial reference implementation of the
  TROTT protocol. Coordinate journeys directly over Nostr, without a
  central dispatch company or platform commission. Riders and drivers
  agree payment between themselves, including cash, M-Pesa or Lightning.

  There is no central DonkeyRide fleet or guaranteed ride availability.
  The app provides the protocol and tools for communities and independent
  operators to coordinate their own service.
repository: https://github.com/TheCryptoDonkey/DonkeyRide
website: https://www.trotters.cc/donkeyride
license: MIT
tags:
  - ridesharing
  - nostr
  - lightning
  - trott

# Local signed release build (assembleRelease output). Produce it with
# scripts/publish-driver-apk.sh, which also verifies the signature and drops
# the APK where the operator serves it.
#
# The APK signing certificate is linked to the publisher's Nostr identity on
# first publish (NIP-C1), so it is as permanent as the publisher key:
#   CN=DonkeyRide, O=forgesworn, C=GB
#   SHA-256 61ca13847eddb053bc25907780a066a672947b7700f96137a6470989930e4dfc
# This matches the configured release keystore and the public v1.0.5 APK.
# Once a build is published, changing this certificate strands every driver
# who installed the old one.
release_source: ./web/android/app/build/outputs/apk/release/app-release.apk
icon: ./web/public/icons/driver-icon-512.png

# Existing Heartwood-backed ForgeSworn publisher identity. Keep this stable
# for every future DonkeyRide Driver release.
pubkey: npub1mgvlrnf5hm9yf0n5mf9nqmvarhvxkc6remu5ec3vf8r0txqkuk7su0e7q2
