# Zapstore publishing config for DonkeyRide Driver (Android).
# Publish with zsp (https://github.com/zapstore/zsp):
#
#   SIGN_WITH=<publisher nsec or bunker://…> zsp publish
#
# The signing key becomes the app's PERMANENT publisher identity on
# Zapstore — every future update must be signed by the same key. Choose
# it deliberately (dedicated forgesworn publisher key, backed up) before
# the first publish. See docs/ZAPSTORE.md.

name: DonkeyRide Driver
description: >-
  Drive with no sign-up, no commission and no company in the middle.
  Jobs arrive over Nostr; riders pay you directly — cash, M-Pesa or
  Lightning. Non-custodial reference implementation of the TROTT
  protocol.
repository: https://github.com/TheCryptoDonkey/DonkeyRide
license: MIT
tags:
  - ridesharing
  - nostr
  - lightning
  - trott

# Local signed release build (assembleRelease output). Produce it with
# scripts/publish-driver-apk.sh, which also verifies the signature and drops
# the APK where the operator serves it.
#
# The APK signing certificate is linked to the publisher's Nostr identity on
# first publish (NIP-C1), so it is as permanent as the publisher key:
#   CN=DonkeyRide, O=forgesworn, C=GB
#   SHA-256 040dcaa92cabdc6cad349a8c08fd0ef7b2c21fc7d4bb66198539160e47f574b8
# (An earlier 61ca1384… was recorded here for a keystore that no longer
# exists anywhere in this repo. Nothing was ever published under it, so
# replacing it breaks no installed app — but once a build IS published,
# changing this certificate strands every driver who installed the old one.)
release_source: ./web/android/app/build/outputs/apk/release/app-release.apk

# Publisher Nostr public key — REPLACE with the chosen publisher npub
# before the first publish, and keep it stable forever after.
# pubkey: npub1...
