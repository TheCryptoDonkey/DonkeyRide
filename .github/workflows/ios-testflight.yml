name: iOS TestFlight upload

# Manual only. Building the driver app compiles an operator URL into it, and
# publishing a build pointed at the wrong operator is worse than not
# publishing one — so this never fires on a push.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: >-
          Operator this build talks to. Compiled in: a wrapped app has no
          serving origin to infer it from, so a new URL means a new build.
        type: string
        default: "https://ride.trotters.dev"
      marketing_version:
        description: CFBundleShortVersionString to stamp into the build
        type: string
        default: "1.0.1"
      upload:
        description: Upload to App Store Connect (off = archive and keep the IPA only)
        type: boolean
        default: true
      internal_group:
        description: Optional internal TestFlight group to attach the build to
        type: string
        required: false

permissions:
  contents: read

jobs:
  testflight:
    # Matches the toolchain the project is verified against locally. Capacitor
    # 8 needs Swift 6.1 for CAPPluginCall.reject; older Xcode silently changes
    # how the location plugin reports failure.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'app.donkeyride.driver' }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      VITE_API_BASE: ${{ inputs.api_base }}

    steps:
      - name: Require deployment secrets
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name repository secret before running this workflow."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Reject a non-https operator
        run: |
          case "$VITE_API_BASE" in
            https://*) ;;
            *)
              echo "::error::api_base must be https — a shipped driver app must not talk to an operator in the clear."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build the driver bundle and sync iOS
        run: |
          export VITE_WS_URL="$(printf '%s' "$VITE_API_BASE" | sed 's|^https://|wss://|')/ws"
          echo "operator: $VITE_API_BASE (ws: $VITE_WS_URL)"
          npm run native:driver:ios --prefix web

      - name: Verify the operator URL was actually compiled in
        run: |
          # A missing VITE_API_BASE does not fail the build, it just bakes in a
          # relative default that cannot work from a file:// WebView.
          if ! grep -rqF "$VITE_API_BASE" web/dist-native-driver/assets/*.js; then
            echo "::error::$VITE_API_BASE is not present in the built bundle."
            exit 1
          fi
          echo "confirmed: $VITE_API_BASE is in the bundle"

      - name: Verify Xcode toolchain
        run: xcodebuild -version

      - name: Prepare App Store Connect API key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          if printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" | grep -q '\\n'; then
            printf '%b' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$key_path"
          else
            printf '%s\n' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$key_path"
          fi
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Prepare export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive
        timeout-minutes: 20
        run: |
          # Run number and attempt, so the build number always climbs.
          # TestFlight refuses one it has seen and there is no way to delete it.
          build_number="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          xcodebuild \
            -project web/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DonkeyRideDriver.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$build_number" \
            archive

      - name: Verify the privacy manifest shipped
        run: |
          # A .xcprivacy outside Copy Bundle Resources does nothing silently,
          # and Apple emails about ITMS-91053 well after the upload "succeeds".
          app="$RUNNER_TEMP/DonkeyRideDriver.xcarchive/Products/Applications/App.app"
          test -f "$app/PrivacyInfo.xcprivacy" \
            || { echo "::error::PrivacyInfo.xcprivacy missing from the archive."; exit 1; }
          echo "privacy manifest present"

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DonkeyRideDriver.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: donkeyride-driver-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}
        run: |
          ipa_path=""
          for candidate in "$RUNNER_TEMP"/export/*.ipa; do
            [ -f "$candidate" ] && { ipa_path="$candidate"; break; }
          done
          [ -n "$ipa_path" ] || { echo "::error::No IPA in $RUNNER_TEMP/export."; exit 1; }
          xcrun altool \
            --upload-app \
            -f "$ipa_path" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
            --output-format json \
            --show-progress

      - name: Verify it reached TestFlight
        if: ${{ inputs.upload }}
        timeout-minutes: 20
        run: |
          node scripts/wait-for-testflight-build.mjs \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --timeout-seconds 900 \
            ${INTERNAL_GROUP:+--internal-group "$INTERNAL_GROUP"}
        env:
          INTERNAL_GROUP: ${{ inputs.internal_group }}

      - name: Remove App Store Connect API key
        if: always()
        run: rm -f "$APP_STORE_CONNECT_API_KEY_PATH"
