# Release discipline: nothing merges with failing tests or a broken build.
# Backend runs on Node 18 AND 20 because production (Nix shell) is Node 18 —
# an API that only exists on newer Node must fail here, not in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The Node test runner has a flaky IPC crash on the GitHub runners
      # ("Unable to deserialize cloned data", nodejs/node#48761) that survives
      # even serial execution. First seen on Node 18; it hit Node 20 too (run
      # 30789091329), so both versions run serially and retry ONCE, and only
      # when the output shows that exact upstream error — a genuine test
      # failure still fails on the first pass.
      - run: |
          set -o pipefail  # default GH shell lacks it; without it tee masks the test exit code
          run_serial() { node --test --test-concurrency=1 tests/integration/*.test.js 2>&1 | tee test-out.log; }
          if ! run_serial; then
            grep -q "Unable to deserialize cloned data" test-out.log || exit 1
            echo "::warning::Retrying after the known Node test-runner IPC flake (nodejs/node#48761)"
            run_serial
          fi

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # tsc --noEmit runs inside the build script (tsc && vite build)
      - run: npm run build
