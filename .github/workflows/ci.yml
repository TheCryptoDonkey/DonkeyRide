# Release discipline: nothing merges with failing tests or a broken build.
# Backend runs on Node 18 AND 20 because production (Nix shell) is Node 18 —
# an API that only exists on newer Node must fail here, not in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must include whatever the Dockerfile ships, or CI is not testing
        # production. Node 18 went EOL in April 2025 and was dropped from
        # both — it also carried the IPC flake below almost every run.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The Node test runner has a flaky IPC crash on the GitHub runners
      # ("Unable to deserialize cloned data", nodejs/node#48761) that survives
      # even serial execution. First seen on Node 18; it hit Node 20 too (run
      # 30789091329), so both versions run serially and retry ONCE, and only
      # when the output shows that exact upstream error — a genuine test
      # failure still fails on the first pass.
      - run: |
          set -o pipefail  # default GH shell lacks it; without it tee masks the test exit code
          # Same selection as `npm test` — recursive, live tests excluded.
          # This used to hardcode tests/integration/*.test.js, so a test in any
          # other directory was silently never run in CI.
          FILES=$(find tests -name '*.test.js' -not -path 'tests/live/*' | sort)
          test -n "$FILES" || { echo "No test files found"; exit 1; }
          echo "$FILES" | sed 's/^/  /'
          run_serial() { node --test --test-concurrency=1 $FILES 2>&1 | tee test-out.log; }
          # Retry the known upstream IPC flake, but never a real failure.
          # Two retries, not one: it hit both the first pass AND the retry on
          # Node 18, leaving main red on a bug we cannot fix.
          attempt=1
          until run_serial; do
            grep -q "Unable to deserialize cloned data" test-out.log || exit 1
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Node test-runner IPC flake persisted across 3 attempts"
              exit 1
            fi
            echo "::warning::Retrying after the known Node test-runner IPC flake (nodejs/node#48761), attempt $attempt"
            attempt=$((attempt + 1))
          done

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # tsc --noEmit runs inside the build script (tsc && vite build)
      - run: npm run build
