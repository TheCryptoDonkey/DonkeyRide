# Release discipline: nothing merges with failing tests or a broken build.
# Backend runs on Node 20 AND 22 because the Dockerfile ships 22 and the Nix
# shell is 22 — an API that only exists on newer Node must fail here, not in
# production. Keep this matrix in step with the Dockerfile: it drifted to
# Node 18 on both and shipped an EOL runtime for months.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must include whatever the Dockerfile ships, or CI is not testing
        # production. Node 18 went EOL in April 2025 and was dropped from
        # both — it also carried the IPC flake below almost every run.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Each test file runs as its OWN process, directly — `node <file>`,
      # not `node --test <file>`.
      #
      # `node --test` forks a child per file and collects results over an IPC
      # channel, and on the GitHub runners that channel intermittently
      # corrupts: "Unable to deserialize cloned data" (nodejs/node#48761).
      # It is upstream and unfixable from here.
      #
      # Retrying it never worked. First the whole suite was retried, which
      # could not help — one invocation covered ~34 files, so an attempt
      # failed if ANY file flaked, making three attempts three chances to hit
      # a flake somewhere rather than three chances for one file to pass
      # (runs 30886992431, 30891573418). Then retries went per-file, which
      # did absorb most of them — but http-api.test.js, the largest file and
      # so the one with the most to serialise, still flaked three times out
      # of three (run 30892080525).
      #
      # Executing the file directly deletes the problem instead of retrying
      # it: node:test runs the tests in-process and sets the exit code, so
      # there is no child, no IPC and nothing to corrupt. Verified locally —
      # all 34 files pass this way in ~76s, a failing file exits 1, a passing
      # file exits 0.
      #
      # `npm test` deliberately still uses the runner: it is faster for
      # developers and the flake is specific to these runners. The FILE
      # SELECTION is identical, which is the part that must not drift.
      - run: |
          # Same selection as `npm test` — recursive, live tests excluded.
          # This used to hardcode tests/integration/*.test.js, so a test in any
          # other directory was silently never run in CI.
          FILES=$(find tests -name '*.test.js' -not -path 'tests/live/*' | sort)
          test -n "$FILES" || { echo "No test files found"; exit 1; }
          echo "$FILES" | sed 's/^/  /'

          FAILED=""
          for f in $FILES; do
            echo "::group::$f"
            # A test that leaks a handle would otherwise hang the job until
            # the 6h GitHub limit. Fail it in 5 minutes instead.
            timeout 300 node tests/helpers/run-with-road-router.js -- node "$f" || FAILED="$FAILED $f"
            echo "::endgroup::"
          done

          if [ -n "$FAILED" ]; then
            echo "::error::Failing test files:$FAILED"
            exit 1
          fi

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # tsc --noEmit runs inside the build script (tsc && vite build)
      - run: npm run build

  ui:
    name: Human journeys in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The browser drives the real Express operator, so both dependency
      # trees are required: root for the backend, web for the two PWAs.
      - run: npm ci
      - run: npm ci --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:ui
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ui-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14
