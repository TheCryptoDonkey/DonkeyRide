# Release discipline: nothing merges with failing tests or a broken build.
# Backend runs on Node 20 AND 22 because the Dockerfile ships 22 and the Nix
# shell is 22 — an API that only exists on newer Node must fail here, not in
# production. Keep this matrix in step with the Dockerfile: it drifted to
# Node 18 on both and shipped an EOL runtime for months.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must include whatever the Dockerfile ships, or CI is not testing
        # production. Node 18 went EOL in April 2025 and was dropped from
        # both — it also carried the IPC flake below almost every run.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The Node test runner has a flaky IPC crash on the GitHub runners
      # ("Unable to deserialize cloned data", nodejs/node#48761): the parent
      # fails to deserialise a message from a test child and kills the run.
      # It is not ours and we cannot fix it, so we retry it — but ONLY it.
      #
      # Retrying the whole suite did not work and could not: one invocation
      # covered ~40 files, so an attempt failed if ANY file flaked, and three
      # attempts were three chances to hit at least one flake across forty
      # files rather than three chances for one file to pass. Runs
      # 30886992431 and 30891573418 both exhausted all three.
      #
      # So each file gets its own `node --test` process and its own retries.
      # That shrinks each IPC stream to one file's output (less to corrupt)
      # and, when a file does flake, re-runs that file alone.
      - run: |
          set -o pipefail  # default GH shell lacks it; without it tee masks the test exit code
          # Same selection as `npm test` — recursive, live tests excluded.
          # This used to hardcode tests/integration/*.test.js, so a test in any
          # other directory was silently never run in CI.
          FILES=$(find tests -name '*.test.js' -not -path 'tests/live/*' | sort)
          test -n "$FILES" || { echo "No test files found"; exit 1; }
          echo "$FILES" | sed 's/^/  /'

          FAILED=""
          FLAKES=0
          for f in $FILES; do
            echo "::group::$f"
            passed=0
            for attempt in 1 2 3; do
              if node --test --test-concurrency=1 "$f" 2>&1 | tee test-out.log; then
                passed=1; break
              fi
              # A genuine failure must fail immediately, never be retried.
              if ! grep -q "Unable to deserialize cloned data" test-out.log; then
                break
              fi
              FLAKES=$((FLAKES + 1))
              echo "::warning file=$f::Known Node test-runner IPC flake (nodejs/node#48761) on attempt $attempt — retrying $f"
            done
            echo "::endgroup::"
            [ "$passed" -eq 1 ] || FAILED="$FAILED $f"
          done

          [ "$FLAKES" -eq 0 ] || echo "::notice::Absorbed $FLAKES upstream IPC flake(s) by re-running the affected file"
          if [ -n "$FAILED" ]; then
            echo "::error::Failing test files:$FAILED"
            exit 1
          fi

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # tsc --noEmit runs inside the build script (tsc && vite build)
      - run: npm run build
