# Release discipline: nothing merges with failing tests or a broken build.
# Backend runs on Node 18 AND 20 because production (Nix shell) is Node 18 —
# an API that only exists on newer Node must fail here, not in production.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Node 18's test runner has a flaky IPC crash under parallel file
      # execution ("Unable to deserialize cloned data", nodejs/node#48761)
      # — run files serially there; Node 20 stays parallel
      - run: |
          if [ "${{ matrix.node }}" = "18" ]; then
            node --test --test-concurrency=1 tests/integration/*.test.js
          else
            npm test
          fi

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      # tsc --noEmit runs inside the build script (tsc && vite build)
      - run: npm run build
