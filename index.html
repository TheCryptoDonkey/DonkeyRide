        // ===== REPUTATION SYSTEM =====

        function updateReputationScore(pubkey, newRating) {
            // Ensure reputationCache exists
            if (!window.reputationCache) {
                console.warn('⚠️ reputationCache not found, initializing...');
                window.reputationCache = {};
            }

            // Initialize reputation for this pubkey if needed
            if (!window.reputationCache[pubkey]) {
                window.reputationCache[pubkey] = {
                    average: 0,
                    total_rides: 0,
                    flags: {},
                    would_ride_again_percent: 100,
                    ratings: []
                };
                console.log(`📝 Initialized reputation for ${pubkey}`);
            }

            const rep = window.reputationCache[pubkey];

            // Ensure ratings array exists
            if (!rep.ratings) {
                console.warn('⚠️ ratings array missing, initializing...');
                rep.ratings = [];
            }

            rep.ratings.push(newRating);
            rep.total_rides++;

            // Calculate average
            const totalScore = rep.ratings.reduce((sum, r) => sum + r.rating, 0);
            rep.average = (totalScore / rep.total_rides).toFixed(1);

            // Count safety flags
            if (newRating.flags && newRating.flags.length > 0) {
                newRating.flags.forEach(flag => {
                    rep.flags[flag] = (rep.flags[flag] || 0) + 1;
                });
            }

            // Calculate would_ride_again percentage
            const wouldRideAgainCount = rep.ratings.filter(r => r.would_ride_again).length;
            rep.would_ride_again_percent = Math.round((wouldRideAgainCount / rep.total_rides) * 100);

            console.log(`📊 Updated reputation for ${pubkey}:`, rep);
        }

        async function getReputationScore(pubkey) {
            // Ensure cache exists
            if (!window.reputationCache) {
                window.reputationCache = {};
            }

            // Check cache first
            if (window.reputationCache[pubkey]) {
                return window.reputationCache[pubkey];
            }

            // In production, fetch from Nostr relays (kind: 57014 events)
            // For demo, generate mock reputation
            const mockScore = Math.random() * 2 + 3;  // 3-5 stars
            const mockRides = Math.floor(Math.random() * 500) + 50;  // 50-550 rides

            const mockRep = {
                average: mockScore.toFixed(1),
                total_rides: mockRides,
                flags: mockScore < 4 ? {
                    'aggressive_driving': Math.floor(Math.random() * 3),
                    'route_deviation': Math.floor(Math.random() * 2)
                } : {},
                would_ride_again_percent: mockScore < 4 ? Math.floor(mockScore * 18) : Math.floor(mockScore * 20),
                trust_level: getTrustLevel(mockScore, mockRides),
                ratings: []  // Initialize empty ratings array
            };

            window.reputationCache[pubkey] = mockRep;
            console.log(`📊 Fetched reputation for ${pubkey}:`, mockRep);
            return mockRep;
        }

        function getTrustLevel(avgRating, totalRides) {
            if (avgRating >= 4.8 && totalRides >= 100) return 'elite';
            if (avgRating >= 4.5 && totalRides >= 50) return 'trusted';
            if (avgRating >= 4.0 && totalRides >= 20) return 'good';
            if (avgRating >= 3.0) return 'fair';
            return 'caution';
        }

        function getTrustBadge(trustLevel) {
            const badges = {
                'elite': '⭐ Elite',
                'trusted': '🛡️ Trusted',
                'good': '✅ Good',
                'fair': '⚠️ Fair',
                'caution': '🚫 Caution'
            };
            return badges[trustLevel] || '❓ New';
        }

        function getTrustColor(trustLevel) {
            const colors = {
                'elite': '#ffd700',
                'trusted': '#22c55e',
                'good': '#3b82f6',
                'fair': '#ffa500',
                'caution': '#dc2626'
            };
            return colors[trustLevel] || '#888';
        }

        function shouldAutoBlock(reputation) {
            // Auto-block criteria
            if (reputation.average < 2.5 && reputation.total_rides > 10) return true;
            if (reputation.would_ride_again_percent < 30 && reputation.total_rides > 20) return true;

            // Count serious flags
            const seriousFlags = [
                'verbal_harassment',
                'aggressive_driving',
                'unsafe_vehicle'
            ];
            let seriousFlagCount = 0;
            seriousFlags.forEach(flag => {
                if (reputation.flags[flag] >= 3) seriousFlagCount++;
            });
            if (seriousFlagCount >= 2) return true;

            return false;
        }

        function resolveDisputeByReputation(riderRep, driverRep, dispute) {
            console.log('📊 Reputation-based auto-resolution:', { riderRep, driverRep, dispute });

            // Trust scores
            const riderTrustScore = parseFloat(riderRep.average) * (1 + riderRep.total_rides / 1000);
            const driverTrustScore = parseFloat(driverRep.average) * (1 + driverRep.total_rides / 1000);

            console.log(`📊 Trust scores - Rider: ${riderTrustScore.toFixed(2)}, Driver: ${driverTrustScore.toFixed(2)}`);

            // Clear difference (> 20% gap) = auto-resolve
            const difference = Math.abs(riderTrustScore - driverTrustScore);
            const percentDiff = (difference / Math.max(riderTrustScore, driverTrustScore)) * 100;

            if (percentDiff > 20) {
                const winner = riderTrustScore > driverTrustScore ? 'rider' : 'driver';
                console.log(`✅ Auto-resolved in favor of ${winner} (${percentDiff.toFixed(1)}% trust difference)`);
                return {
                    auto_resolved: true,
                    winner: winner,
                    reason: `${winner === 'driver' ? 'Driver' : 'Rider'} has significantly higher trust score`,
                    confidence: percentDiff.toFixed(1) + '%'
                };
            }

            // Too close - needs arbitration
            console.log('⚖️ Trust scores too close - manual arbitration required');
            return {
                auto_resolved: false,
                reason: 'Trust scores too similar, requires community arbitration'
            };
        }

        // ===== END REPUTATION SYSTEM =====

        // Function to start continuous rider GPS tracking
        function startRiderTracking() {
            // Clear any existing watch first to prevent duplicates
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                console.log('🔄 Cleared existing GPS watch');
            }
            
            if (navigator.geolocation) {
                console.log('🛰️ Starting continuous GPS tracking for rider...');
                
                // First get current position immediately
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updateRiderPosition(position);
                        console.log('✅ Got initial GPS position');
                        updateGPSStatus('active', '✅ GPS tracking active');
                    },
                    (error) => {
                        console.log('⚠️ Initial GPS failed:', error.message);
                        updateGPSStatus('error', `GPS error: ${error.message}`);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    }
                );
                
                // Then start watching for changes
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        updateRiderPosition(position);
                    },
                    (error) => {
                        console.log('GPS tracking error:', error.message);
                        updateGPSStatus('error', `GPS error: ${error.message}`);
                        // Don't stop tracking, just log the error
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 1000,
                        timeout: 10000
                    }
                );
                console.log('👁️ GPS watch active with ID:', watchId);
            } else {
                console.log('❌ Geolocation not supported');
            }
        }
        
        // Separate function to update rider position
        // Function to update GPS status indicator
        function updateGPSStatus(status, message) {
            const gpsStatus = document.getElementById('gpsStatus');
            const gpsStatusText = document.getElementById('gpsStatusText');
            
            if (gpsStatus && gpsStatusText) {
                gpsStatus.style.display = 'flex';
                gpsStatus.className = 'gps-status ' + status;
                gpsStatusText.textContent = message;
                
                // Auto-hide success messages after 3 seconds
                if (status === 'active') {
                    setTimeout(() => {
                        if (gpsStatus.className.includes('active')) {
                            gpsStatus.style.display = 'none';
                        }
                    }, 3000);
                }
            }
        }
        
        function updateRiderPosition(position) {
            const newLat = position.coords.latitude;
            const newLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            // Validate coordinates
            if (isNaN(newLat) || isNaN(newLng)) {
                console.log('⚠️ Invalid GPS coordinates received');
                updateGPSStatus('error', 'Invalid GPS coordinates');
                return;
            }
            
            // Show GPS updating status
            updateGPSStatus('updating', `📍 Updating location (±${Math.round(accuracy)}m)`)
            
            // Check if position actually changed
            const oldLat = riderLocation ? riderLocation[0] : 0;
            const oldLng = riderLocation ? riderLocation[1] : 0;
            const distance = Math.sqrt(Math.pow(newLat - oldLat, 2) + Math.pow(newLng - oldLng, 2));
            
            // Update rider location
            riderLocation = [newLat, newLng];
            
            // Store location in localStorage for persistence
            localStorage.setItem('riderGPSLocation', JSON.stringify({
                lat: newLat,
                lng: newLng,
                accuracy: accuracy,
                timestamp: Date.now()
            }));
            
            // Move rider marker smoothly
            if (riderMarker) {
                riderMarker.setLatLng(riderLocation);
            } else {
                riderMarker = L.marker(riderLocation, {icon: riderIcon}).addTo(map);
            }
            
            // Update pickup location field with accuracy
            const fromInput = document.getElementById('fromLocation');
            if (fromInput) {
                fromInput.value = `📍 Current Location (±${Math.round(accuracy)}m)`;
            }
            
            // Always keep map centered on rider when they move
            if (map) {
                // Use setView for immediate update with current zoom
                const currentZoom = map.getZoom();
                map.setView(riderLocation, currentZoom >= 13 ? currentZoom : 14, { 
                    animate: true, 
                    duration: 0.3,
                    easeLinearity: 0.5 
                });
                console.log(`🗺️ Map centered on rider: ${newLat.toFixed(6)}, ${newLng.toFixed(6)}`);
            }
            
            // Update destination if moved significantly
            const destinationInput = document.getElementById('toLocation');
            if (destinationInput) {
                const lastLat = parseFloat(destinationInput.dataset.lastLat || newLat);
                const lastLng = parseFloat(destinationInput.dataset.lastLng || newLng);
                const distCheck = Math.sqrt(
                    Math.pow(newLat - lastLat, 2) +
                    Math.pow(newLng - lastLng, 2)
                );
                
                if (distCheck > 0.005) { // About 0.3 miles
                    const nearestStation = getNearestStation(newLat, newLng);
                    destinationInput.value = nearestStation.name + ' Station';
                    destinationInput.dataset.lat = nearestStation.lat;
                    destinationInput.dataset.lng = nearestStation.lng;
                    destinationInput.dataset.lastLat = newLat;
                    destinationInput.dataset.lastLng = newLng;
                }
            }
            
            // Log significant movements
            if (distance > 0.00001) { // About 1 meter
                console.log(`📍 GPS Update: ${newLat.toFixed(6)}, ${newLng.toFixed(6)} (±${Math.round(accuracy)}m) - moved ${(distance * 111000).toFixed(1)}m`);
                updateGPSStatus('active', `📍 Location updated (±${Math.round(accuracy)}m)`);
            }
        }
        
        // Function to simulate driver movement
        function startDriverSimulation() {
            if (driverMovementInterval) {
                clearInterval(driverMovementInterval);
            }
            
            console.log('🚗 Starting driver movement simulation...');
            
            // Simulate driver wandering around
            driverMovementInterval = setInterval(() => {
                if (driverLocation && driverMarker && !currentRide) {
                    // Random movement within area (smaller movements for realism)
                    const moveLat = (Math.random() - 0.5) * 0.0003;
                    const moveLng = (Math.random() - 0.5) * 0.0003;
                    
                    driverLocation[0] += moveLat;
                    driverLocation[1] += moveLng;
                    
                    // Keep driver within reasonable bounds of rider
                    if (riderLocation) {
                        const maxDistance = 0.015; // About 1 mile
                        const latDiff = driverLocation[0] - riderLocation[0];
                        const lngDiff = driverLocation[1] - riderLocation[1];
                        
                        if (Math.abs(latDiff) > maxDistance) {
                            driverLocation[0] = riderLocation[0] + (latDiff > 0 ? maxDistance : -maxDistance);
                        }
                        if (Math.abs(lngDiff) > maxDistance) {
                            driverLocation[1] = riderLocation[1] + (lngDiff > 0 ? maxDistance : -maxDistance);
                        }
                    }
                    
                    // Update marker smoothly
                    driverMarker.setLatLng(driverLocation);
                }
            }, 3000); // Update every 3 seconds
        }
        
        // Initialize on load
        window.onload = function() {
            console.log('🚀 DonkeyRide initializing...');
            console.log('📡 Geolocation support:', 'geolocation' in navigator ? 'YES' : 'NO');
            
            // Check if we're on HTTPS (required for geolocation in many browsers)
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                console.warn('⚠️ GPS may not work on non-HTTPS sites. Current protocol:', location.protocol);
            }
            
            initMap();
        };
    </script>
